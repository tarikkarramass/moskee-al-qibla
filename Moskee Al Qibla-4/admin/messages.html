<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berichten — Beheer · Moskee Al Qibla</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#1d4a39">
<link rel="stylesheet" href="admin.css">
<style>
  .msg-card{cursor:pointer;}
  .msg-card.unread{border-left:3px solid var(--green);}
  .msg-card .row-main h4{display:flex;align-items:center;gap:10px;}
  .unread-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:0 0 auto;}
  .msg-from{font-size:12.5px;color:var(--ink-3);margin-top:2px;}
  .pill.subject{background:rgba(156,124,51,.16);color:var(--brass);}
  /* detailweergave */
  .msg-detail .adm-modal-body{display:flex;flex-direction:column;gap:18px;}
  .md-meta{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:14px;}
  .md-meta .k{color:var(--ink-3);font-weight:600;}
  .md-meta .v{color:var(--ink);}
  .md-meta .v a{color:var(--green);}
  .md-body{background:var(--paper-2);border:1px solid var(--line);border-radius:5px;padding:18px 20px;font-size:15px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;}
  .md-sub-lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px;}
</style>
</head>
<body>
<div class="adm-scrim"></div>
<div class="adm-shell">
  <aside class="adm-side">
    <div class="brand"><span class="brand-mark serif">Al<span class="q">qibla</span></span><span class="brand-tag">Beheer</span></div>
    <div class="panel-lbl">Menu</div>
    <nav class="adm-nav"></nav>
    <div class="spacer"></div>
    <div class="acct">
      <div class="adm-who-lbl">Ingelogd als</div>
      <div class="adm-who">—</div>
      <button class="adm-signout">↩ Uitloggen</button>
      <a class="view-site" href="../index.html" target="_blank">↗ Bekijk de website</a>
    </div>
  </aside>

  <div class="adm-main">
    <div class="adm-topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="adm-burger">☰</button>
        <div class="ttl"><span class="eyebrow">Beheer</span><h1 class="serif">Berichten</h1></div>
      </div>
      <div class="actions">
        <button class="adm-btn ghost" id="refreshBtn">↻ Vernieuwen</button>
      </div>
    </div>
    <div class="cfg-banner">Supabase is nog niet ingesteld. Vul je gegevens in <code>supabase-config.js</code> in — zie <code>SUPABASE_SETUP.md</code>.</div>

    <div class="adm-content">
      <div class="list-head">
        <div class="filters">
          <div class="seg" id="filter">
            <button class="on" data-f="all">Alles</button>
            <button data-f="unread">Ongelezen</button>
          </div>
        </div>
        <span id="countLbl" style="font-size:13px;color:var(--ink-3);"></span>
      </div>
      <div id="listWrap"></div>
    </div>
  </div>
</div>

<!-- DETAIL MODAL -->
<div class="adm-overlay" id="detail">
  <div class="adm-modal msg-detail">
    <div class="adm-modal-head">
      <h3 class="serif" id="dTitle">Bericht</h3>
      <button class="modal-x" id="dClose">✕</button>
    </div>
    <div class="adm-modal-body">
      <div class="md-meta">
        <span class="k">Van</span><span class="v" id="d-name">—</span>
        <span class="k">E-mail</span><span class="v" id="d-email">—</span>
        <span class="k">Onderwerp</span><span class="v" id="d-subject">—</span>
        <span class="k">Ontvangen</span><span class="v" id="d-date">—</span>
      </div>
      <div>
        <div class="md-sub-lbl">Bericht</div>
        <div class="md-body" id="d-message">—</div>
      </div>
    </div>
    <div class="adm-modal-foot">
      <button class="adm-btn danger" id="dDelete">🗑 Verwijderen</button>
      <a class="adm-btn primary" id="dReply" href="#">↩ Beantwoorden via e-mail</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="admin-core.js"></script>
<script>
(async function () {
  const { $, el, esc, sb, fmtDate, toast, confirmDialog } = Admin;
  const user = await Admin.requireAuth();
  Admin.mountShell("messages.html", user ? user.email : "");
  if (!user) return;

  let items = [], filter = "all", current = null;

  $("#filter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...$("#filter").children].forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  });
  $("#refreshBtn").addEventListener("click", load);
  $("#dClose").addEventListener("click", closeDetail);
  $("#detail").addEventListener("click", e => { if (e.target.id === "detail") closeDetail(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });
  $("#dDelete").addEventListener("click", () => current && delMsg(current));

  function fmtDateTime(d) {
    if (!d) return "—";
    const x = new Date(d); if (isNaN(x)) return "—";
    const t = x.toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit" });
    return fmtDate(d, true) + " · " + t;
  }

  async function load() {
    const wrap = $("#listWrap");
    wrap.innerHTML = `<div class="adm-list">${'<div class="skeleton"></div>'.repeat(3)}</div>`;
    try {
      const { data, error } = await sb.from("contact_messages")
        .select("*").order("created_at", { ascending: false });
      if (error) throw error;
      items = data || [];
      render();
    } catch (e) {
      wrap.innerHTML = `<div class="state error"><div class="ic">⚠</div>
        <h3 class="serif">Berichten konden niet laden</h3>
        <p>Is de tabel <code>contact_messages</code> aangemaakt? Draai <code>supabase-berichten.sql</code> in de SQL Editor.</p></div>`;
    }
  }

  function render() {
    const wrap = $("#listWrap");
    const list = items.filter(r => filter === "all" || !r.is_read);
    const unread = items.filter(r => !r.is_read).length;
    $("#countLbl").textContent = `${items.length} ${items.length === 1 ? "bericht" : "berichten"}` +
      (unread ? ` · ${unread} ongelezen` : "");

    if (!items.length) {
      wrap.innerHTML = `<div class="state"><div class="ic">✉</div>
        <h3 class="serif">Nog geen berichten</h3>
        <p>Berichten die bezoekers via het contactformulier sturen, verschijnen hier.</p></div>`;
      return;
    }
    if (!list.length) {
      wrap.innerHTML = `<div class="state"><div class="ic">✓</div>
        <h3 class="serif">Alles gelezen</h3><p>Je hebt geen ongelezen berichten.</p></div>`;
      return;
    }

    const listEl = el("div", { class: "adm-list" });
    list.forEach(r => {
      const card = el("div", { class: "row-card msg-card" + (r.is_read ? "" : " unread") });
      const snippet = (r.message || "").replace(/\s+/g, " ").slice(0, 120);
      card.innerHTML = `
        <div class="row-thumb">✉</div>
        <div class="row-main">
          <h4 class="serif">${r.is_read ? "" : '<span class="unread-dot"></span>'}${esc(r.name) || "(geen naam)"}</h4>
          <div class="msg-from">${esc(r.email)}</div>
          <div class="sub">${esc(snippet)}${(r.message || "").length > 120 ? "…" : ""}</div>
          <div class="row-meta">
            ${r.subject ? `<span class="pill subject"><span class="dot"></span>${esc(r.subject)}</span>` : ""}
            <span class="date">${fmtDateTime(r.created_at)}</span>
          </div>
        </div>`;
      const actions = el("div", { class: "row-actions" },
        el("button", { class: "icon-btn", title: "Openen", onclick: () => openDetail(r) }, "↗"),
        el("button", { class: "icon-btn del", title: "Verwijderen", onclick: e => { e.stopPropagation(); delMsg(r); } }, "🗑")
      );
      card.addEventListener("click", e => { if (!e.target.closest(".row-actions")) openDetail(r); });
      card.appendChild(actions);
      listEl.appendChild(card);
    });
    wrap.innerHTML = ""; wrap.appendChild(listEl);
  }

  async function openDetail(r) {
    current = r;
    $("#d-name").textContent = r.name || "—";
    $("#d-email").innerHTML = r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : "—";
    $("#d-subject").textContent = r.subject || "—";
    $("#d-date").textContent = fmtDateTime(r.created_at);
    $("#d-message").textContent = r.message || "—";
    const sub = encodeURIComponent("Re: " + (r.subject || "uw bericht aan Moskee Al Qibla"));
    const body = encodeURIComponent("\n\n— — —\nOp " + fmtDateTime(r.created_at) + " schreef " + (r.name || "") + ":\n" + (r.message || ""));
    $("#dReply").href = `mailto:${r.email}?subject=${sub}&body=${body}`;
    $("#detail").classList.add("open");
    document.body.style.overflow = "hidden";
    if (!r.is_read) await markRead(r);
  }
  function closeDetail() { $("#detail").classList.remove("open"); document.body.style.overflow = ""; current = null; }

  async function markRead(r) {
    try {
      const { error } = await sb.from("contact_messages").update({ is_read: true }).eq("id", r.id);
      if (error) throw error;
      r.is_read = true; render();
    } catch (e) { /* stil: niet kritiek */ }
  }

  async function delMsg(r) {
    const ok = await confirmDialog({
      title: "Bericht verwijderen?",
      body: `Het bericht van ${r.name || "deze bezoeker"} wordt definitief verwijderd. Dit kan niet ongedaan worden gemaakt.`,
      confirm: "Verwijderen"
    });
    if (!ok) return;
    try {
      const { error } = await sb.from("contact_messages").delete().eq("id", r.id);
      if (error) throw error;
      items = items.filter(x => x.id !== r.id);
      if (current && current.id === r.id) closeDetail();
      render();
      toast("Bericht verwijderd.", "ok");
    } catch (e) {
      toast("Verwijderen mislukt: " + (e.message || "onbekende fout"), "err");
    }
  }

  load();
})();
</script>
</body>
</html>
