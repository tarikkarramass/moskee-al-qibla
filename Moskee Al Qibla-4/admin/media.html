<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media — Beheer · Moskee Al Qibla</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#1d4a39">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="adm-scrim"></div>
<div class="adm-shell">
  <aside class="adm-side">
    <div class="brand"><span class="brand-mark serif">Al<span class="q">qibla</span></span><span class="brand-tag">Beheer</span></div>
    <div class="panel-lbl">Menu</div>
    <nav class="adm-nav"></nav>
    <div class="spacer"></div>
    <div class="acct">
      <div class="adm-who-lbl">Ingelogd als</div>
      <div class="adm-who">—</div>
      <button class="adm-signout">↩ Uitloggen</button>
      <a class="view-site" href="../index.html" target="_blank">↗ Bekijk de website</a>
    </div>
  </aside>

  <div class="adm-main">
    <div class="adm-topbar">
      <div style="display:flex;align-items:center;gap:14px;">
        <button class="adm-burger">☰</button>
        <div class="ttl"><span class="eyebrow">Beheer</span><h1 class="serif">Media &amp; uploads</h1></div>
      </div>
      <div class="actions">
        <button class="adm-btn primary" id="upBtn">⬆ Uploaden</button>
        <input type="file" id="upFile" accept="image/*" hidden multiple>
      </div>
    </div>
    <div class="cfg-banner">Supabase is nog niet ingesteld. Vul je gegevens in <code>supabase-config.js</code> in — zie <code>SUPABASE_SETUP.md</code>.</div>

    <div class="adm-content">
      <div class="list-head">
        <div class="filters">
          <div class="seg" id="filter">
            <button class="on" data-f="all">Alles</button>
            <button data-f="news">Nieuws</button>
            <button data-f="videos">Video's</button>
            <button data-f="uploads">Overig</button>
          </div>
        </div>
        <span id="countLbl" style="font-size:13px;color:var(--ink-3);"></span>
      </div>
      <div id="grid"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="../supabase-config.js"></script>
<script src="admin-core.js"></script>
<script>
(async function () {
  const user = await Admin.requireAuth();
  Admin.mountShell("media.html", user ? user.email : "");
  if (!user) return;

  const { sb, esc, toast, confirmDialog, publicUrl } = Admin;
  const BUCKET = Admin.cfg.BUCKET;
  const FOLDERS = ["news", "videos", "uploads"];
  let files = [], filter = "all";

  const grid = document.getElementById("grid");

  document.getElementById("filter").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    [...document.getElementById("filter").children].forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  });

  const upFile = document.getElementById("upFile");
  document.getElementById("upBtn").addEventListener("click", () => upFile.click());
  upFile.addEventListener("change", async () => {
    if (!upFile.files.length) return;
    let done = 0;
    for (const f of upFile.files) {
      if (!f.type.startsWith("image/")) { toast("Overgeslagen (geen afbeelding): " + f.name, "err"); continue; }
      try { await Admin.uploadImage(f, "uploads"); done++; }
      catch (e) { toast("Upload mislukt: " + (e.message || f.name), "err"); }
    }
    upFile.value = "";
    if (done) toast(done + " bestand(en) geüpload.", "ok");
    load();
  });

  async function load() {
    grid.innerHTML = `<div class="media-grid">${'<div class="skeleton" style="height:170px"></div>'.repeat(6)}</div>`;
    try {
      files = [];
      for (const folder of FOLDERS) {
        const { data, error } = await sb.storage.from(BUCKET).list(folder, { limit: 200, sortBy: { column: "created_at", order: "desc" } });
        if (error) throw error;
        (data || []).filter(f => f.id).forEach(f => files.push({ folder, name: f.name, path: folder + "/" + f.name }));
      }
      render();
    } catch (e) {
      grid.innerHTML = `<div class="state error"><div class="ic">⚠</div>
        <h3 class="serif">Kon media niet laden</h3>
        <p>${esc(e.message || "Onbekende fout")}. Bestaat de bucket <code>${esc(BUCKET)}</code> en zijn de policies ingesteld?</p>
        <button class="adm-btn ghost" onclick="location.reload()">Opnieuw proberen</button></div>`;
    }
  }

  function render() {
    const list = files.filter(f => filter === "all" || f.folder === filter);
    document.getElementById("countLbl").textContent = `${list.length} bestand${list.length === 1 ? "" : "en"}`;
    if (!files.length) {
      grid.innerHTML = `<div class="state"><div class="ic">❏</div>
        <h3 class="serif">Nog geen media</h3>
        <p>Upload afbeeldingen, of voeg ze toe bij een nieuwsbericht of video. Ze verschijnen hier.</p>
        <button class="adm-btn primary" onclick="document.getElementById('upBtn').click()">⬆ Uploaden</button></div>`;
      return;
    }
    if (!list.length) { grid.innerHTML = `<div class="state"><div class="ic">⌕</div><h3 class="serif">Geen resultaten</h3><p>Geen media in deze map.</p></div>`; return; }

    const g = document.createElement("div"); g.className = "media-grid";
    list.forEach(f => {
      const url = publicUrl(f.path);
      const item = document.createElement("div"); item.className = "media-item";
      item.innerHTML = `
        <a class="ph" href="${esc(url)}" target="_blank"><img src="${esc(url)}" alt="" loading="lazy"></a>
        <div class="mi-foot">
          <span class="mi-name" title="${esc(f.path)}">${esc(f.name)}</span>
          <button class="icon-btn del" title="Verwijderen">🗑</button>
        </div>`;
      item.querySelector(".del").addEventListener("click", () => del(f));
      g.appendChild(item);
    });
    grid.innerHTML = ""; grid.appendChild(g);
  }

  async function del(f) {
    const yes = await confirmDialog({
      title: "Bestand verwijderen?",
      body: `"${f.name}" wordt definitief uit de opslag verwijderd. Als dit bij een bericht of video hoort, verdwijnt de afbeelding daar ook.`,
      confirm: "Verwijderen",
    });
    if (!yes) return;
    const { error } = await sb.storage.from(BUCKET).remove([f.path]);
    if (error) { toast("Verwijderen mislukt: " + error.message, "err"); return; }
    toast("Bestand verwijderd.", "ok");
    load();
  }

  load();
})();
</script>
</body>
</html>
